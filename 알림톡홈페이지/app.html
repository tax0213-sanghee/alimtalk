<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>관리센터 · 세무사 알림톡</title>
<meta name="robots" content="noindex">
<script src="auth.js"></script>
<script>AlimAuth.require();</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
html,body{margin:0}
/* 택스팟 사무실 앱(web/src/styles/index.css)과 같은 자. 왼쪽 기둥(옅은 회색) + 46px 제목줄 + 흰 본문.
   택스팟은 밝은 화면 한 벌만 쓰므로 여기도 밝은 화면으로 고정한다. */
:root{
  --bg:#FFFFFF; --rail:#F7F7F9; --card:#FFFFFF;
  --ink:#18181D; --body:#505058; --muted-strong:#6B6B73; --muted:#8E8E96; --faint:#C9C9CF;
  --field:#F1F1F4; --line:#E4E4E9; --line-soft:#F0F0F4;
  --brand:#4F46E5; --brand-dark:#4338CA; --brand-soft:#F1F0FD;
  --accent:#505058; --accent-ink:#3E3E45; --accent-soft:#F1F1F4; --accent-line:#E4E4E9;
  --bad:#D03B3B; --bad-bg:#FCEBE9; --bad-ink:#B3352A;
  --warn:#E0A020; --warn-bg:#FFF7E0; --warn-line:#F0E3B8; --warn-ink:#7A5606;
  --good:#2E9E62; --good-bg:#E7F6EE; --good-ink:#1E6E43;
  --font:'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--body);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{color:var(--ink);line-height:1.3;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea,table,.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--brand);outline-offset:1px}

/* ── 틀 ── */
.app{display:grid;grid-template-columns:212px 1fr;min-height:100vh;align-items:start}
.rail{position:sticky;top:0;height:100vh;overflow:auto;background:var(--rail);border-right:1px solid var(--line)}
.rail-head{position:sticky;top:0;z-index:2;height:46px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--rail)}
.ws{display:flex;align-items:center;gap:8px;min-width:0;padding:4px 6px;border-radius:6px}
.ws-logo{width:22px;height:22px;border-radius:6px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.ws b{font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-body{padding:4px 10px 32px}
.folder{font-size:12px;color:var(--muted);padding:8px 7px 3px}
.sep{height:1px;background:var(--line);margin:8px 6px}
.row{margin-bottom:1px;display:flex;width:100%;align-items:center;gap:8px;border:0;background:none;border-radius:6px;padding:5px 10px;font-size:14px;line-height:1.25;color:var(--ink);text-align:left;cursor:pointer}
.row:hover{background:var(--card)}
.row .ic{width:16px;height:16px;flex:none;color:var(--muted);display:flex}
.row .lb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.row[aria-current="page"] .ic{color:var(--brand)}
.pillnum{min-width:19px;border-radius:999px;padding:1px 6px;text-align:center;font-size:12px;font-weight:800;background:var(--field);color:var(--muted-strong)}
.row[aria-current="page"] .pillnum{background:var(--card);color:var(--brand)}
.pillnum.alert{background:var(--bad-bg);color:var(--bad-ink)}
.rail-foot{padding:10px 14px 16px;font-size:12px;letter-spacing:.02em;color:var(--faint)}
.top{position:sticky;top:0;z-index:30;height:46px;display:flex;align-items:center;gap:6px;background:var(--bg);
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.top .grp{font-size:14px;color:var(--muted)}
.top .slash{color:var(--line)}
.top h1{font-size:14px;font-weight:400;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.top .meta{font-size:12px;color:var(--muted);white-space:nowrap}
.chip-demo{margin-left:8px;border-radius:4px;background:var(--warn-bg);color:var(--warn-ink);padding:2px 6px;font-weight:700}
main{max-width:1280px;margin:0 auto;width:100%;min-width:0;padding-block:8px 64px;
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.mnav{display:none}

/* ── 부품 ── */
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{position:relative;border:0;background:none;padding:8px 14px 10px;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--brand)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2.5px;border-radius:99px;background:var(--brand)}
.tab .n{margin-left:6px;border-radius:999px;background:var(--field);padding:1px 6px;font-size:12px;font-weight:800;color:var(--muted-strong)}
.lead{font-size:13px;color:var(--muted-strong);margin:0 0 14px;max-width:72ch}
.lead b{color:var(--ink)}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.stat{border:1px solid var(--line);border-radius:6px;padding:10px 14px;background:var(--card);text-align:left}
.stat .l{font-size:13px;font-weight:600;color:var(--muted-strong)}
.stat .v{font-size:23px;font-weight:800;letter-spacing:-.01em;color:var(--ink);margin-top:2px}
.stat .v.bad{color:var(--bad-ink)}
.stat .h{font-size:12px;color:var(--muted);margin-top:1px}

.card{border:1px solid var(--line);border-radius:6px;background:var(--card);padding:16px;margin-bottom:16px;min-width:0}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.card-h h3{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;letter-spacing:-.01em;min-width:0}
.card-h h3::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--accent);flex:none}
.card-h .sub{font-size:13px;font-weight:600;color:var(--muted)}
.card-h .r{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card.min .card-h{border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px}
.card.min .card-h h3::before{display:none}
.cols{display:grid;grid-template-columns:2fr 1fr;gap:16px;align-items:start}
.cols > *{min-width:0}
.cols.half{grid-template-columns:1fr 1fr}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:6px;font-size:14px;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--muted-strong);cursor:pointer;white-space:nowrap;transition:.12s}
.btn:hover{border-color:var(--brand);background:var(--field);color:var(--ink)}
.btn.primary{border-color:transparent;background:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-dark)}
.btn.danger{border-color:#E9C4C0;color:var(--bad-ink)}
.btn.danger:hover{border-color:var(--bad);background:var(--bad-bg)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.hstack{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.tag{display:inline-block;white-space:nowrap;border-radius:5px;border:1px solid var(--line);padding:3px 8px;font-size:12px;font-weight:700;background:var(--card);color:var(--muted-strong)}
.tag.good{border-color:var(--good);color:var(--good-ink)}
.tag.warn{border-color:var(--warn-line);color:var(--warn-ink)}
.tag.bad{border-color:var(--bad);color:var(--bad-ink)}
.tag.info{border-color:var(--accent-line);color:var(--accent-ink)}
.tag.soft{font-weight:400}

.seg{display:inline-flex;gap:2px;border-radius:6px;background:var(--field);padding:3px}
.seg button{border:0;background:none;border-radius:7px;padding:6px 14px;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--brand);box-shadow:0 1px 2px rgb(20 20 25/.08)}
.seg.sm{padding:2px}.seg.sm button{padding:4px 10px;font-size:12px}

.inp,.sel{height:32px;border:1px solid transparent;border-radius:6px;background:var(--field);padding:0 10px;font-size:14px;color:var(--ink);width:100%}
.inp:focus,.sel:focus{outline:none;border-color:var(--brand);background:var(--card)}
.inp::placeholder{color:var(--faint)}
textarea.inp{height:auto;padding:8px 10px;min-height:90px;line-height:1.6;resize:vertical}
.fl{display:flex;flex-direction:column;gap:5px}
.fl > label{font-size:13px;font-weight:600;color:var(--muted-strong)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{width:100%;border-collapse:collapse;min-width:560px}
thead tr{background:var(--accent-soft)}
th{text-align:left;padding:8px 12px;font-size:13px;font-weight:600;color:var(--muted-strong);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--body)}
tbody tr:last-child td{border-bottom-color:transparent}
tbody tr.hov:hover td{background:var(--field);border-bottom-color:var(--brand)}
td.r,th.r{text-align:right}
td b,td strong{color:var(--ink)}
tr.off td{color:var(--muted)}
tr.off td.nm{text-decoration:line-through}
tr.sel-row td{background:var(--brand-soft)}
tr.sub > td{background:var(--rail);padding:10px 12px 14px}
td .inp,td .sel{height:28px;font-size:13px}
input[type="checkbox"],input[type="radio"]{width:16px;height:16px;accent-color:var(--brand)}
.empty{padding:36px;text-align:center;color:var(--muted)}

.note{border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:13px;color:var(--muted-strong);background:var(--rail)}
.note b{color:var(--ink)}
.note.bad{border-color:#E9C4C0;background:var(--bad-bg);color:var(--bad-ink)}
.note.good{border-color:#BFE3CD;background:var(--good-bg);color:var(--good-ink)}
.small{font-size:12px}.muted{color:var(--muted)}

/* 그룹 기둥 (주소록) */
.ab{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:start}
.ab > *{min-width:0}
.gbox{border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:240px}
.gtitle{font-size:12px;color:var(--muted);padding:2px 4px}
.gitem{display:flex;align-items:center;gap:6px;border:0;background:none;padding:6px 8px;border-radius:6px;cursor:pointer;text-align:left;color:var(--ink);width:100%}
.gitem:hover{background:var(--field)}
.gitem[aria-current="true"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.gitem .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.gitem .c{font-size:12px;font-weight:800;color:var(--muted-strong);background:var(--field);border-radius:999px;padding:1px 6px}
.gitem[aria-current="true"] .c{background:var(--card);color:var(--brand)}
.gadd{display:flex;gap:6px;border-top:1px solid var(--line);padding-top:10px;margin-top:auto}
.bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:1px solid var(--brand);background:var(--brand-soft);border-radius:6px;padding:7px 10px;margin-bottom:10px}
.bulk b{color:var(--brand)}
.bulk .sel{width:auto;height:28px;background:var(--card)}

/* 템플릿 카드 */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tcard{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.tcard:hover{border-color:var(--brand)}
.tcard[aria-pressed="true"]{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.tcard b{color:var(--ink)}
.tsnip{font-size:12.5px;color:var(--muted-strong);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}

/* 메시지 작성 줄 (윙고 꼴, 택스팟 전송 화면) */
.wline{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.wline:last-child{border-bottom:0}
.wline > .k{font-size:13px;font-weight:700;color:var(--ink);padding-top:6px}
.wline > div{min-width:0}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.chks{display:flex;flex-wrap:wrap;gap:8px 16px}
.rcpt{display:flex;flex-wrap:wrap;gap:6px;max-height:120px;overflow:auto}
.rcpt span{border:1px solid var(--line);border-radius:5px;padding:2px 8px;font-size:12px;background:var(--card)}

/* 휴대폰 미리보기 — 택스팟 AlimtalkPage 의 그것 */
.phone{margin:0 auto;width:270px;max-width:100%;border-radius:36px;border:3px solid #D9DCE3;background:#fff;padding:6px;box-shadow:0 1px 2px rgb(20 20 25/.05)}
.screen{height:500px;display:flex;flex-direction:column;overflow:hidden;border-radius:30px;background:#B2C7DA}
.screen .bar{display:flex;align-items:center;gap:8px;padding:12px 16px;font-size:13px;font-weight:700;color:#191919}
.screen .scroll{flex:1;min-height:0;overflow-y:auto;padding:12px 12px 16px}
.msg{position:relative;margin:0 8px 0 4px}
.kakao{position:absolute;right:-8px;top:-12px;z-index:1;width:34px;height:34px;border-radius:50%;background:#4A3B32;color:#FEE500;font-size:7px;font-weight:900;display:grid;place-items:center;letter-spacing:-.02em}
.mbox{overflow:hidden;border-radius:12px;background:#fff;box-shadow:0 1px 2px rgb(0 0 0/.06)}
.mhead{background:#FEE500;padding:8px 12px;font-size:12.5px;font-weight:700;color:#3C1E1E}
.mbody{white-space:pre-line;padding:10px 12px;font-size:12.5px;line-height:1.65;color:#191919;word-break:keep-all;overflow-wrap:anywhere}
.mbody .v{background:#FFF3B0;border-radius:3px;padding:0 2px}
.mbtn{margin:0 12px 12px;border-radius:6px;background:#F2F3F5;padding:6px;text-align:center;font-size:12.5px;color:#191919}
.pcap{margin:12px 0 0;text-align:center;font-size:12px;color:var(--muted)}

/* 거래처별 */
.hgrid{display:grid;grid-template-columns:290px 1fr;gap:16px;align-items:start}
.hgrid > *{min-width:0}
.clist{display:flex;flex-direction:column;gap:1px;max-height:560px;overflow-y:auto}
.citem{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--ink)}
.citem:hover{background:var(--field)}
.citem[aria-current="true"]{background:var(--brand-soft)}
.hdetail{display:grid;grid-template-columns:1fr 290px;gap:16px;align-items:start}
.hdetail > *{min-width:0}

/* 카드 등록 */
.cardvis{border-radius:10px;padding:16px;background:linear-gradient(135deg,#4F46E5,#2A2470);color:#fff;max-width:300px;aspect-ratio:1.6;display:flex;flex-direction:column;justify-content:space-between}
.cardvis .n{font-variant-numeric:tabular-nums;letter-spacing:.12em;font-size:16px}
.nocard{border:1.5px dashed var(--line);border-radius:10px;max-width:300px;aspect-ratio:1.6;display:grid;place-items:center;text-align:center;color:var(--muted);padding:16px}
.tiers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tier{border:1px solid var(--line);border-radius:6px;padding:10px}
.tier.on{border-color:var(--brand);background:var(--brand-soft)}
.tier .t{font-size:12px;color:var(--muted-strong)}
.tier .p{font-weight:800;color:var(--ink)}
.tier.on .p{color:var(--brand)}

.drop{border:1.5px dashed var(--line);border-radius:6px;padding:18px;text-align:center;color:var(--muted);cursor:pointer}
.drop.over{border-color:var(--brand);background:var(--brand-soft)}
.layer{position:fixed;inset:0;background:rgb(24 24 29/.4);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--card);border-radius:12px;max-width:480px;width:100%;padding:20px;display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto;box-shadow:0 6px 20px rgb(79 83 214/.10)}
.modal h3{font-size:16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:6px;z-index:60;font-size:13px;max-width:calc(100% - 32px)}
.check-list{margin:0;padding-left:18px}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--field);padding:1px 5px;border-radius:4px}

@media (max-width:1100px){ .hdetail{grid-template-columns:1fr} }
@media (max-width:1024px){ .cols,.cols.half{grid-template-columns:1fr} .stats{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:860px){ .ab,.hgrid{grid-template-columns:1fr} .clist{max-height:260px} .tiers{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:767px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  .mnav{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}
  .mnav button{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:6px 12px;font-size:13px;color:var(--ink);cursor:pointer}
  .mnav button[aria-current="page"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}
  .top,main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top .meta{display:none}
  .fgrid{grid-template-columns:1fr}
  .wline{grid-template-columns:1fr;gap:4px}
}
@media (max-width:480px){ .stats{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="메뉴">
    <div class="rail-head"><div class="ws"><span class="ws-logo" id="ws-logo">정</span><b id="ws-name">정훈세무회계</b></div></div>
    <div class="rail-body" id="nav"></div>
  </aside>
  <div style="min-width:0">
    <header class="top">
      <span class="grp" id="crumb-g"></span><span class="slash" id="crumb-s">/</span>
      <h1 id="crumb-t"></h1>
      <span class="sp"></span>
      <span class="meta"><span id="me-name">김정훈 세무사</span><span class="chip-demo">예시 자료</span></span><button class="btn sm" id="logout" style="margin-left:8px">로그아웃</button>
    </header>
    <main><div class="mnav" id="mnav"></div><div id="main"></div></main>
  </div>
</div>
<div id="layer"></div>

<script>
/* ───────── 그림 (택스팟 Icon.tsx 와 같은 선 그림) ───────── */
const IC={
  home:'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',
  user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  doc:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/>',
  send:'<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/>',
  check:'<path d="M22 11.1V12a10 10 0 1 1-5.9-9.1"/><path d="M22 4L12 14l-3-3"/>',
  wallet:'<path d="M20 8V6a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h15a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6"/><circle cx="17" cy="14" r="1.2"/>',

const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const grp=id=>S.groups.find(g=>g.id===id);
const sendable=c=>!c.optout&&(c.gid==null||grp(c.gid)?.send!==false);
const active=()=>S.contacts.filter(sendable).length;

const tierOf=n=>S.tiers.findIndex(t=>t.max===null||n<=t.max);
const tierLabel=i=>{const t=S.tiers[i],p=S.tiers[i-1];return t.max===null?`${p.max+1}명 이상`:(p?`${p.max+1}~${t.max}명`:`${t.max}명 이하`);};
const normPhone=p=>{const d=String(p).replace(/\D/g,'');if(!/^01[016789]\d{7,8}$/.test(d))return null;return d.length===11?`${d.slice(0,3)}-${d.slice(3,7)}-${d.slice(7)}`:`${d.slice(0,3)}-${d.slice(3,6)}-${d.slice(6)}`;};
function groupByName(name){name=String(name||'').trim();if(!name)return null;let g=S.groups.find(x=>x.name===name);if(!g){g={id:S.nextGid++,name,send:true};S.groups.push(g);}return g.id;}
const tpl=id=>S.templates.find(t=>t.id===id);
const weekly=()=>S.templates.find(t=>t.weekly);
const AUTO_VARS=['세무사명','고객명','상호','회차제목','사무실전화'];
const varsOf=b=>[...new Set([...String(b).matchAll(/#\{(.+?)\}/g)].map(m=>m[1]))];
const extraVars=b=>varsOf(b).filter(v=>!AUTO_VARS.includes(v));

}

function sendTargets(){
  const sd=S.send;
  if(sd.mode==='picked') return S.contacts.filter(c=>sd.picked.includes(c.id)&&!c.optout);
  return S.contacts.filter(c=>!c.optout&&sd.gids.has(c.gid==null?'none':c.gid));
}
function checkSend(){
  const sd=S.send,t=sd.tid?tpl(sd.tid):null,tg=sendTargets(),bad=[],warn=[];
  if(!t) bad.push('템플릿을 고르지 않았습니다 — 「템플릿 선택」에서 골라 주세요.');
  if(!tg.length) bad.push('받는 분이 없습니다 — 그룹을 고르거나 주소록에서 번호를 골라 주세요.');
  if(t) extraVars(t.body).filter(v=>!String(sd.vars[v]||'').trim()).forEach(v=>bad.push(`「${v}」 값이 비어 있습니다.`));
  if(sd.when==='later'&&!sd.at) bad.push('예약 시각을 골라 주세요.');
  if(sd.when==='later'&&sd.at){const h=+sd.at.slice(11,13); if(h<8||h>=21) warn.push('밤 9시~아침 8시 발송은 고객 불편이 생길 수 있습니다.');}
  const optCount=(sd.mode==='picked'?S.contacts.filter(c=>sd.picked.includes(c.id)&&c.optout):S.contacts.filter(c=>c.optout&&sd.gids.has(c.gid==null?'none':c.gid))).length;
  if(optCount) warn.push(`수신거부 ${optCount}명은 저절로 빠졌습니다.`);
  return {bad,warn};
}

function contactLedger(){
  const m=new Map();
  S.contacts.forEach(c=>m.set(c.phone,{phone:c.phone,name:c.name,biz:c.biz,gone:false,items:[]}));
  S.history.forEach(h=>h.logs.forEach(l=>{if(!m.has(l.phone))m.set(l.phone,{phone:l.phone,name:l.name,biz:l.biz,gone:true,items:[]});m.get(l.phone).items.push({h,l});}));
  return [...m.values()];
}

  const q=S.hq.trim(),all=contactLedger(),list=all.filter(x=>!q||(x.name+x.phone+x.biz).includes(q));

      ${cur.items.length?`<div class="hdetail"><div class="tw"><table style="min-width:0">

function seedLogs(){
  S.history.forEach((h,i)=>{
    h.id=i+1;h.type=h.type||'정기';
    if(h.type==='정기'){h.tid=1;h.vars={'회차제목':h.title};}else{h.tid=2;h.vars={'신고기간':'2026년 2기 예정','제출기한':'10월 20일(화)'};}
    const pool=h.type==='직접'?S.contacts.filter(c=>c.gid===1&&!c.optout):S.contacts.filter(sendable);
    h.logs=pool.slice(0,h.sent).map(c=>({phone:c.phone,name:c.name,biz:c.biz,at:`${h.date} ${h.type==='정기'?S.schedule.time:'14:20'}`,result:h.fb&&c.id===3?'문자대체':'알림톡'}));
    h.sent=h.logs.length;h.fb=h.logs.filter(l=>l.result!=='알림톡').length;h.ok=h.sent-h.fb;
  });
  S.history.push({id:99,date:'2026-09-29',no:41,type:'정기',title:'9월 5주차 세무일정',tid:1,vars:{'회차제목':'9월 5주차 세무일정'},sent:2,ok:2,fb:0,

}

      ${o.card?`<div class="cardvis"><div class="small">${esc(o.card.brand)}카드 · 자동결제</div><div class="n">····  ····  ····  ${esc(o.card.last4)}</div><div class="small">${esc(o.owner)}</div></div>
        <div class="hstack" style="margin-top:12px"><button class="btn" id="reg-card">카드 변경</button><button class="btn danger" id="del-card">자동결제 해지</button></div>`
      :`<div class="nocard"><div>등록된 카드가 없습니다<br><button class="btn primary" id="reg-card" style="margin-top:10px">카드 등록</button></div></div>`}
    </section>
    <section class="card"><div class="card-h"><h3>요금 구간</h3><span class="sub">발송 대상 고객 수 기준</span></div>
      <div class="tiers">${S.tiers.map((t,i)=>`<div class="tier ${i===ti?'on':''}"><div class="t">${tierLabel(i)}</div><div class="p tnum">${won(t.price)}</div></div>`).join('')}</div>
      <div class="note" style="margin-top:12px">지금 발송 대상 <b class="tnum">${n}명</b> → 다음 결제 <b class="tnum">${won(S.tiers[ti].price)}</b> (11월 ${S.billDay}일)</div>
    </section>
  </div>
  <section class="card"><div class="card-h"><h3>결제 내역</h3></div><div class="tw"><table>
    <thead><tr><th>결제일</th><th>구간</th><th class="r">금액</th><th>상태</th></tr></thead>
    <tbody>${S.payments.map(p=>`<tr class="hov"><td class="tnum">${p.date}</td><td>${esc(p.tier)}</td><td class="r tnum"><b>${won(p.amount)}</b></td><td>${tag(p.status,'good')}</td></tr>`).join('')}</tbody></table></div></section>`;
}

/* ───────── 그리기 ───────── */
function render(){renderNav();document.getElementById('main').innerHTML=({home:vHome,kakao:vKakao,billing:vBilling})[S.view]();}
function go(v,tab){S.view=v;if(tab)S.tab=tab;S.editing=null;render();window.scrollTo(0,0);}
function modal(html){const L=document.getElementById('layer');L.innerHTML=`<div class="layer"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  L.querySelector('.layer').addEventListener('click',e=>{if(e.target.classList.contains('layer'))closeModal();});}
function closeModal(){document.getElementById('layer').innerHTML='';}

function cardModal(){
  modal(`<div class="hstack small muted" style="justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:10px"><span>토스페이먼츠 · 카드 자동결제 등록</span><span>데모 화면</span></div>
  <h3>결제할 카드를 등록하세요</h3>
  <p class="small muted" style="margin:0">실서비스에서는 이 창을 토스페이먼츠가 직접 띄웁니다. 데모에서는 카드사와 끝 4자리만 넣습니다.</p>
  <div class="fgrid"><div class="fl"><label for="c-brand">카드사</label><select id="c-brand" class="sel">${['신한','국민','삼성','현대','롯데','하나','우리','BC','NH농협'].map(b=>`<option>${b}</option>`).join('')}</select></div>
  <div class="fl"><label for="c-last">카드번호 끝 4자리</label><input id="c-last" class="inp tnum" maxlength="4" inputmode="numeric" placeholder="0000"></div></div>
  <label class="chk small"><input type="checkbox" id="c-agree"> 매월 ${S.billDay}일 고객 수 기준 요금 자동결제에 동의합니다</label>
  <div class="hstack" style="justify-content:flex-end"><button class="btn" data-close>취소</button><button class="btn primary" id="c-ok">등록</button></div>`);
}
function uploadModal(){
  modal(`<h3>주소록 불러오기</h3>
  <p class="small muted" style="margin:0">엑셀(xlsx · xls · csv) 첫 줄에 <code>고객명</code> <code>휴대폰</code> <code>상호</code> <code>그룹명</code> 순서로 있으면 됩니다. 없는 그룹 이름은 새로 만들어집니다.</p>
  <div class="drop" id="drop" tabindex="0"><span id="drop-t">파일을 끌어다 놓거나 눌러서 고르기</span><input type="file" id="file" accept=".xlsx,.xls,.csv" hidden></div>
  <div class="fl"><label for="paste">또는 붙여넣기</label><textarea id="paste" class="inp" placeholder="강민지, 010-1234-5678, 민지카페, 기장고객"></textarea></div>
  <div class="fgrid"><div class="fl"><label for="up-g">그룹명이 없는 번호는</label><select id="up-g" class="sel">${groupOptions(typeof S.gfilter==='number'?S.gfilter:null)}</select></div>
  <div class="fl"><label for="mode">반영 방식</label><select id="mode" class="sel"><option value="merge">추가 · 갱신</option><option value="replace">전체 교체</option></select></div></div>
  <div id="up-result"></div>
  <div class="hstack" style="justify-content:flex-end"><button class="btn" data-close>닫기</button><button class="btn" id="up-check">미리 확인</button><button class="btn primary" id="up-apply" disabled>반영</button></div>`);
  const drop=document.getElementById('drop'),file=document.getElementById('file');
  drop.onclick=()=>file.click();drop.onkeydown=e=>{if(e.key==='Enter')file.click();};
  drop.ondragover=e=>{e.preventDefault();drop.classList.add('over');};drop.ondragleave=()=>drop.classList.remove('over');
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');if(e.dataTransfer.files[0])readFile(e.dataTransfer.files[0]);};
  file.onchange=()=>{if(file.files[0])readFile(file.files[0]);};
}
let pending=null;
function readFile(f){
  const r=new FileReader();
  r.onload=e=>{try{let rows;
    if(/\.csv$/i.test(f.name))rows=new TextDecoder('utf-8').decode(e.target.result).split(/\r?\n/).map(l=>l.split(','));
    else{const wb=XLSX.read(e.target.result,{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1});}
    document.getElementById('paste').value=rows.map(r=>r.slice(0,4).map(v=>v??'').join(', ')).join('\n');
    document.getElementById('drop-t').textContent=f.name+' 읽음';check();
  }catch(err){toast('파일을 읽지 못했습니다. 첫 시트에 고객명 · 휴대폰 칸이 있는지 확인해 주세요.');}};
  r.readAsArrayBuffer(f);
}
function check(){
  const lines=document.getElementById('paste').value.split('\n').map(l=>l.split(/[,\t]/).map(s=>s.trim())).filter(r=>r.join('')!=='');
  const add=[],upd=[],bad=[];
  lines.forEach((r,i)=>{if(i===0&&/이름|고객/.test(r[0]))return;const ph=normPhone(r[1]);if(!r[0]||!ph){bad.push(r.join(' / '));return;}
    (S.contacts.find(c=>c.phone===ph)?upd:add).push({name:r[0],phone:ph,biz:r[2]||'',gname:r[3]||''});});
  const upg=document.getElementById('up-g').value;
  const newG=[...new Set([...add,...upd].map(x=>x.gname).filter(n=>n&&!S.groups.some(g=>g.name===n)))];
  pending={add,upd,mode:document.getElementById('mode').value,defGid:upg?+upg:null};
  const removed=pending.mode==='replace'?S.contacts.filter(c=>!upd.some(u=>u.phone===c.phone)).length:0;
  document.getElementById('up-result').innerHTML=`<div class="hstack">${tag('새로 추가 '+add.length,'good')}${tag('정보 수정 '+upd.length,'warn')}${pending.mode==='replace'?tag('명단에서 빠짐 '+removed,'bad'):''}${bad.length?tag('확인 필요 '+bad.length,'bad'):''}${newG.length?tag('새 그룹 '+newG.join(', ')):''}</div>
    ${bad.length?`<p class="small muted" style="margin:6px 0 0">번호 형식이 맞지 않는 줄: ${bad.slice(0,3).map(esc).join(' · ')}${bad.length>3?' 외':''}</p>`:''}`;
  document.getElementById('up-apply').disabled=!(add.length||upd.length);
}
function apply(){
  if(!pending)return;
  if(pending.mode==='replace')S.contacts=S.contacts.filter(c=>pending.upd.some(u=>u.phone===c.phone));
  const gidFor=x=>x.gname?groupByName(x.gname):pending.defGid;
  pending.upd.forEach(u=>{const c=S.contacts.find(c=>c.phone===u.phone);Object.assign(c,{name:u.name,biz:u.biz});if(u.gname)c.gid=gidFor(u);});
  pending.add.forEach(a=>S.contacts.push({id:S.nextId++,name:a.name,phone:a.phone,biz:a.biz,gid:gidFor(a),optout:false}));
  toast(`주소록에 반영했습니다 · 추가 ${pending.add.length}명, 수정 ${pending.upd.length}명`);pending=null;closeModal();render();
}

/* ───────── 이벤트 ───────── */
const filteredRows=()=>{const q=S.q.trim();return S.contacts.filter(c=>inFilter(c)&&(!q||(c.name+c.phone+c.biz).includes(q)));};
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-close],[data-hmsg]');if(!t)return;const d=t.dataset;
  if(d.go)return go(d.go,d.tabgo);
  if(d.tab){S.tab=d.tab;return render();}
  if('close' in d)return closeModal();
  if(d.hview){S.hView=d.hview;return render();}
  if(d.hopen){S.hOpen=S.hOpen===+d.hopen?null:+d.hopen;return render();}
  if(d.hc){S.view='kakao';S.tab='결과';S.hView='contact';S.hContact=d.hc;S.hMsg=null;render();return;}
  if(d.hmsg){S.hMsg=+d.hmsg;return render();}
  if(d.tsel){S.tSel=+d.tsel;return render();}
  if(d.smode){S.send.mode=d.smode;S.send.checked=false;S.send.armed=false;return render();}
  if(d.unres){S.reserved=S.reserved.filter(r=>r.id!==+d.unres);toast('예약을 취소했습니다.');return render();}
  if(d.gf){S.gfilter=(d.gf==='all'||d.gf==='none')?d.gf:+d.gf;S.sel.clear();S.editing=null;S.renaming=false;return render();}
  if(d.gsend){const g=grp(+d.gsend);g.send=!g.send;toast(`'${g.name}' 그룹을 매주 발송에서 ${g.send?'포함':'제외'}했습니다.`);return render();}
  if('grename' in d){S.renaming=true;render();document.getElementById('g-rn')?.select();return;}
  if('rnCancel' in d){S.renaming=false;return render();}
  if(d.gdel){const g=grp(+d.gdel),n=S.contacts.filter(c=>c.gid===g.id).length;
    if(t.dataset.armed){S.contacts.forEach(c=>{if(c.gid===g.id)c.gid=null;});S.groups=S.groups.filter(x=>x.id!==g.id);S.gfilter='all';toast(`'${g.name}' 그룹을 지웠습니다. 번호 ${n}개는 미지정으로 남았습니다.`);return render();}
    t.dataset.armed='1';t.textContent=n?`삭제 확인 (번호 ${n}개는 미지정으로)`:'삭제 확인';return;}
  if(d.edit){S.editing=+d.edit;return render();}
  if('cancel' in d){const c=S.contacts.find(x=>x.id===S.editing);if(c&&!c.name&&!c.phone)S.contacts=S.contacts.filter(x=>x!==c);S.editing=null;return render();}
  if(d.save){const c=S.contacts.find(x=>x.id===+d.save),ph=normPhone(document.getElementById('e-phone').value),nm=document.getElementById('e-name').value.trim();
    if(!nm)return toast('고객명을 넣어 주세요.');if(!ph)return toast('휴대폰 번호 형식을 확인해 주세요. 예: 010-1234-5678');
    if(S.contacts.some(x=>x.phone===ph&&x.id!==c.id))return toast('이미 주소록에 있는 번호입니다.');
    const gv=document.getElementById('e-gid').value;Object.assign(c,{name:nm,phone:ph,biz:document.getElementById('e-biz').value.trim(),gid:gv?+gv:null});S.editing=null;toast('저장했습니다.');return render();}
  if(d.del){const c=S.contacts.find(x=>x.id===+d.del);if(t.dataset.armed){S.contacts=S.contacts.filter(x=>x.id!==c.id);toast(`${c.name} 님을 지웠습니다.`);return render();}
    t.dataset.armed='1';t.textContent='한 번 더 누르면 삭제';return;}
  if(d.opt){const c=S.contacts.find(x=>x.id===+d.opt);c.optout=!c.optout;return render();}
  switch(t.id){
    case 'add-row':{const c={id:S.nextId++,name:'',phone:'',biz:'',optout:false,gid:typeof S.gfilter==='number'?S.gfilter:null};S.contacts.unshift(c);S.editing=c.id;S.q='';render();document.getElementById('e-name')?.focus();break;}
    case 'open-upload':uploadModal();break;
    case 'up-check':check();break;
    case 'up-apply':apply();break;
    case 'bulk-move':{const v=document.getElementById('bulk-g').value,gid=v?+v:null;S.contacts.forEach(c=>{if(S.sel.has(c.id))c.gid=gid;});toast(`${S.sel.size}명을 '${gid?grp(gid).name:'미지정'}'(으)로 옮겼습니다.`);S.sel.clear();render();break;}
    case 'bulk-send':S.send.mode='picked';S.send.picked=[...S.sel];S.send.checked=false;S.sel.clear();go('kakao',S.send.tid?'발송':'템플릿');if(!S.send.tid)toast('보낼 템플릿을 골라 주세요.');break;
    case 'bulk-opt':S.contacts.forEach(c=>{if(S.sel.has(c.id))c.optout=true;});toast(`${S.sel.size}명을 수신거부로 바꿨습니다.`);S.sel.clear();render();break;
    case 'bulk-del':if(t.dataset.armed){const n=S.sel.size;S.contacts=S.contacts.filter(c=>!S.sel.has(c.id));S.sel.clear();toast(`${n}명을 지웠습니다.`);render();}else{t.dataset.armed='1';t.textContent=`${S.sel.size}명 삭제 확인`;}break;
    case 'bulk-clear':S.sel.clear();render();break;
    case 'to-send':S.send.tid=S.tSel;S.send.checked=false;S.send.armed=false;go('kakao','발송');break;
    case 'do-check':S.send.checked=true;S.send.armed=false;render();break;
    case 'do-send':{const sd=S.send;if(!sd.armed){sd.armed=true;return render();}
      const t2=tpl(sd.tid),tg=sendTargets(),n=tg.length;
      if(sd.when==='now'){const now=new Date(),day=now.toISOString().slice(0,10),hm=now.toTimeString().slice(0,5);
        S.history.unshift({id:Date.now(),date:day,type:'직접',title:t2.name,tid:t2.id,vars:{...sd.vars},sent:n,ok:n,fb:0,logs:tg.map(c=>({phone:c.phone,name:c.name,biz:c.biz,at:`${day} ${hm}`,result:'알림톡'}))});
        toast(`${n}명에게 보냈습니다. 받았는지는 몇 분 뒤 전송 결과에서 확인하세요.`);}
      else{S.reserved.push({id:Date.now(),at:sd.at,title:t2.name,n});toast(`${sd.at.replace('T',' ')}에 보내도록 예약했습니다.`);}
      S.send={...sd,tid:null,vars:{},when:'now',at:'',checked:false,armed:false,picked:[]};S.hView='date';go('kakao','결과');break;}
    case 'reg-card':cardModal();break;
    case 'c-ok':{const l=document.getElementById('c-last').value;if(!/^\d{4}$/.test(l))return toast('카드번호 끝 4자리를 숫자로 넣어 주세요.');
      if(!document.getElementById('c-agree').checked)return toast('자동결제 동의에 체크해 주세요.');
      S.office.card={brand:document.getElementById('c-brand').value,last4:l};S.office.bill='정상';closeModal();toast('카드를 등록했습니다. 다음 결제일부터 자동으로 결제됩니다.');render();break;}
    case 'del-card':if(t.dataset.armed){S.office.card=null;S.office.bill='미등록';toast('자동결제를 해지했습니다.');render();}else{t.dataset.armed='1';t.textContent='한 번 더 누르면 해지';}break;
  }
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='g-add'){const v=document.getElementById('g-new').value.trim();if(!v)return toast('그룹 이름을 넣어 주세요.');
    if(S.groups.some(g=>g.name===v))return toast('같은 이름의 그룹이 이미 있습니다.');
    const g={id:S.nextGid++,name:v,send:true};S.groups.push(g);S.gfilter=g.id;S.sel.clear();toast(`'${v}' 그룹을 만들었습니다.`);render();}
  if(e.target.id==='g-rename'){const v=document.getElementById('g-rn').value.trim(),g=grp(S.gfilter);if(!v)return toast('그룹 이름을 넣어 주세요.');
    if(S.groups.some(x=>x.name===v&&x.id!==g.id))return toast('같은 이름의 그룹이 이미 있습니다.');g.name=v;S.renaming=false;toast('그룹 이름을 바꿨습니다.');render();}
});
const keepFocus=id=>{const el=document.getElementById(id);if(!el)return;const p=el.selectionStart;render();const n=document.getElementById(id);n.focus();try{n.setSelectionRange(p,p);}catch(_){}};
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='q'){S.q=e.target.value;keepFocus('q');}
  if(id==='hq'){S.hq=e.target.value;keepFocus('hq');}
  if(e.target.dataset.svar!==undefined){S.send.vars[e.target.dataset.svar]=e.target.value;S.send.checked=false;S.send.armed=false;keepFocus(id);}
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(e.target.dataset.sel){const k=+e.target.dataset.sel;e.target.checked?S.sel.add(k):S.sel.delete(k);return render();}
  if(id==='sel-all'){filteredRows().forEach(c=>e.target.checked?S.sel.add(c.id):S.sel.delete(c.id));return render();}
  if(e.target.dataset.sg!==undefined){const k=e.target.dataset.sg==='none'?'none':+e.target.dataset.sg;e.target.checked?S.send.gids.add(k):S.send.gids.delete(k);S.send.checked=false;S.send.armed=false;return render();}
  if(e.target.name==='when'){S.send.when=e.target.value;S.send.checked=false;S.send.armed=false;return render();}
  if(id==='s-at'){S.send.at=e.target.value;S.send.checked=false;S.send.armed=false;return render();}
  if(id==='mode'){document.getElementById('up-result').innerHTML='';document.getElementById('up-apply').disabled=true;pending=null;}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset?.hmsg){S.hMsg=+e.target.dataset.hmsg;render();}});

seedLogs();
render();
</script>

<script>
/* 로그인한 세무사의 사무소로 화면을 채운다 — 주소록 · 내역은 아직 예시 자료 */
(function(){
  var me=AlimAuth.current(); if(!me) return;
  S.office.name=me.office; S.office.owner=me.name; S.office.channel=me.channel||'채널 연결 전';
  if(me.phone){var d=String(me.phone);S.office.phone=d.length===11?d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7):d;}
  /* 막 가입한 세무사 — 카드 · 결제 기록은 아직 없다 */
  S.office.card=null; S.office.bill='미등록'; S.payments=[];

  document.getElementById('ws-logo').textContent=(me.office||'?').trim()[0];
  document.getElementById('me-name').textContent=me.name+' 세무사';
  document.title=me.office+' · 세무사 알림톡';
  render();
  document.getElementById('logout').addEventListener('click',function(){AlimAuth.signOut();location.replace('login.html');});
})();
</script>
